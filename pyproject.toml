[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",   # el largo de línea lo controla el formateador
    "DJ001",  # null=True en CharField: se usa a propósito en campos opcionales
]

[tool.ruff.lint.isort]
known-first-party = ["core", "estructura", "config"]
