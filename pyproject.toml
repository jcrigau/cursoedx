[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    "E501",   # el largo de línea lo controla el formateador
    "DJ001",  # null=True en CharField: se usa a propósito en campos opcionales
]

[tool.ruff.lint.per-file-ignores]
# Las fixtures compartidas se reexportan importándolas, y el test que las usa
# recibe un parámetro con el mismo nombre. Para ruff es una redefinición; para
# pytest es la única forma de compartirlas entre apps.
"*/tests/conftest.py" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["core", "estructura", "config"]
